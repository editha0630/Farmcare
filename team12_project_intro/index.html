<head>
  <meta charset="utf-8">

  <title>Farmcare Team 12 소개</title>
  <meta name="description" content="전남 함평의 농지를 돌보는 고령 부모님과 수도권에 사는 자녀의 고민에서 출발한 Farmcare Team 12의 소개 페이지">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='18' r='12' fill='%23e07a2e'/%3E%3Cpath d='M10 7h12l-6 5z' fill='%235f7a3a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">

  <style>
/* css/style.css */
/* =========================================================
   Farmcare 팀 소개 페이지 — 스타일
   색상은 :root 토큰에서 한 번에 조정할 수 있습니다.
   ========================================================= */

:root {
  --persimmon: #e07a2e;
  --persimmon-deep: #b85a1a;
  --persimmon-soft: #f6d9bf;
  --leaf: #5f7a3a;
  --leaf-soft: #e3ead3;
  --soil: #3b2a1e;
  --soil-2: #5a4232;
  --cream: #fbf6ec;
  --paper: #fffdf8;
  --line: #e7dccb;
  --ink: #2b2018;
  --ink-soft: #6b5a4c;
  --night: #15100c;

  --serif: "Noto Serif KR", "Nanum Myeongjo", serif;
  --sans: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;

  --radius: 14px;
  --shadow: 0 10px 30px rgba(43, 32, 24, 0.14);
  --topbar-h: 60px;
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.7;
  color: var(--ink);
  background: var(--cream);
  word-break: keep-all;
  overflow-wrap: break-word;
}

body[data-view="intro"] { background: var(--night); overflow: hidden; }
body.is-locked { overflow: hidden; }

[hidden] { display: none !important; }

h1, h2, h3 { font-family: var(--serif); line-height: 1.35; margin: 0; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
a { color: inherit; }

:focus-visible {
  outline: 3px solid var(--persimmon);
  outline-offset: 3px;
}

.visually-hidden {
  position: absolute !important;
  width: 1px; height: 1px;
  overflow: hidden; clip: rect(0 0 0 0);
  white-space: nowrap;
}

.eyebrow {
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--persimmon-deep);
}

/* ---------- 버튼 ---------- */
.btn {
  font: inherit;
  font-size: 0.92rem;
  font-weight: 500;
  border-radius: 999px;
  padding: 0.5em 1.1em;
  cursor: pointer;
  border: 1px solid transparent;
  white-space: nowrap;
  flex: none;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
}
.btn--ghost {
  background: rgba(255, 253, 248, 0.12);
  border-color: rgba(255, 253, 248, 0.45);
  color: #fff;
  backdrop-filter: blur(6px);
}
.btn--ghost:hover { background: rgba(255, 253, 248, 0.25); }
.btn--small { font-size: 0.85rem; padding: 0.4em 0.95em; }

/* ---------- 안내 배너 ---------- */
.notice {
  position: fixed; inset: 0 0 auto 0;
  z-index: 100;
  padding: 0.8rem 1rem;
  background: var(--persimmon-deep);
  color: #fff;
  text-align: center;
  font-size: 0.95rem;
}

/* =========================================================
   이미지 자리표시자
   이미지가 없을 때 그라데이션과 파일명을 보여주고,
   이미지가 로드되면(.has-img) 그 위를 덮습니다.
   ========================================================= */
[data-ph] {
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}
[data-ph]:not(.has-img)::after {
  content: attr(data-ph-label);
  position: absolute;
  right: 12px; bottom: 12px;
  font-size: 0.75rem;
  letter-spacing: 0.05em;
  color: rgba(255, 255, 255, 0.55);
  border: 1px dashed rgba(255, 255, 255, 0.4);
  border-radius: 6px;
  padding: 0.25em 0.6em;
  pointer-events: none;
}
.intro__bg[data-ph]:not(.has-img)::after { right: 5%; bottom: 5%; }
[data-ph="scene1"]  { background-image: radial-gradient(ellipse at 70% 30%, #a8603a 0%, #5a3424 45%, #24160f 100%); }
[data-ph="scene2"]  { background-image: radial-gradient(circle at 60% 35%, #f3a54a 0%, #c9682a 30%, #5f4a24 70%, #2a2216 100%); }
[data-ph="scene3"]  { background-image: linear-gradient(180deg, #2c2a4a 0%, #7a4a5a 55%, #d0784a 85%, #3a2418 100%); }
[data-ph="orchard"] { background-image: linear-gradient(180deg, #f0c27a 0%, #c98a3e 40%, #6f7a3a 70%, #3e4a22 100%); }
[data-ph="hub"]     { background-image: linear-gradient(170deg, #f7d9a6 0%, #e2a65e 35%, #9aa25a 65%, #5f7a3a 100%); }

/* =========================================================
   인트로
   ========================================================= */
.intro {
  position: fixed;
  inset: 0;
  overflow: hidden;
  color: #fff;
  background: var(--night);
  user-select: none;
}

.intro__bg {
  position: absolute;
  inset: 0;
  transition: opacity 0.9s ease, transform 6s ease-out;
  transform: scale(1.04);
}
.intro__bg.is-entering { opacity: 0; }

.intro__bg--orchard {
  opacity: 0;
  transform: scale(1);
  transition: opacity 1.2s ease, transform 3s cubic-bezier(.4, 0, .2, 1);
}
.intro.is-transitioning .intro__bg--orchard { opacity: 1; transform: scale(1.22) translateY(2%); }
.intro.is-transitioning .intro__bg:not(.intro__bg--orchard) { opacity: 0; }

.intro__vignette {
  position: absolute; inset: 0;
  pointer-events: none;
  background:
    linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.7) 100%),
    radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.45) 100%);
}

.intro__top {
  position: absolute;
  top: 0; left: 0; right: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 1.1rem clamp(1rem, 4vw, 2.5rem);
  z-index: 3;
}
.intro__chapter {
  font-family: var(--serif);
  font-size: clamp(0.9rem, 2.2vw, 1.05rem);
  opacity: 0;
  transform: translateY(-6px);
  transition: opacity 0.6s, transform 0.6s;
  text-shadow: 0 1px 8px rgba(0,0,0,0.6);
}
.intro__chapter.is-visible { opacity: 1; transform: none; }
.intro__chapter b {
  display: inline-block;
  font-family: var(--sans);
  font-size: 0.75em;
  letter-spacing: 0.14em;
  color: var(--persimmon-soft);
  margin-right: 0.6em;
}

.intro__headline,
.intro__caption {
  position: absolute;
  left: 50%; top: 44%;
  width: min(90%, 820px);
  transform: translate(-50%, -50%);
  text-align: center;
  font-family: var(--serif);
  font-weight: 700;
  font-size: clamp(1.5rem, 4.6vw, 2.6rem);
  line-height: 1.5;
  text-shadow: 0 2px 20px rgba(0,0,0,0.7);
  opacity: 0;
  transition: opacity 0.9s ease;
  z-index: 2;
  pointer-events: none;
}
.intro__headline.is-visible,
.intro__caption.is-visible { opacity: 1; }
.intro__caption { font-size: clamp(1.15rem, 3.4vw, 1.7rem); font-weight: 500; }
/* 전환 화면 아래 줄 (Team 12) — 가는 선 사이에 넓은 자간, 본문보다 한 박자 늦게 나타남 */
.intro__subcaption {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1.1em;
  margin-top: 1em;
  padding-left: 0.5em;            /* 자간 때문에 생기는 오른쪽 여백만큼 보정 */
  font-family: var(--serif);
  font-size: 0.68em;
  font-weight: 700;
  letter-spacing: 0.5em;
  text-transform: uppercase;
  color: #fff6e2;
  text-shadow: 0 1px 3px rgba(40, 20, 5, 0.6), 0 2px 18px rgba(0, 0, 0, 0.55);
  opacity: 0;
  transition: opacity 1.4s ease 0.9s;
}
.intro__subcaption::before,
.intro__subcaption::after {
  content: "";
  width: clamp(2rem, 8vw, 4.5rem);
  height: 1px;
  background: linear-gradient(to right, transparent, rgba(255, 246, 226, 0.95));
  box-shadow: 0 1px 6px rgba(0, 0, 0, 0.35);
}
.intro__subcaption::after { background: linear-gradient(to left, transparent, rgba(255, 246, 226, 0.95)); }
.intro__caption.is-visible .intro__subcaption { opacity: 1; }

/* 대화창 */
.dialog {
  position: absolute;
  left: 50%;
  bottom: clamp(3.2rem, 9vh, 5rem);
  transform: translateX(-50%);
  width: min(calc(100% - 2rem), 860px);
  min-height: 9.5rem;
  padding: 1.25rem 1.5rem 2.2rem;
  border-radius: var(--radius);
  background: rgba(21, 16, 12, 0.72);
  border: 1px solid rgba(255, 236, 214, 0.18);
  backdrop-filter: blur(8px);
  box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  cursor: pointer;
  z-index: 3;
  transition: opacity 0.5s ease, transform 0.5s ease;
}
.dialog.is-hidden { opacity: 0; transform: translateX(-50%) translateY(12px); pointer-events: none; }
.dialog:focus-visible { outline-color: var(--persimmon-soft); }

.dialog__speaker {
  display: inline-block;
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  color: var(--soil);
  background: var(--persimmon-soft);
  border-radius: 999px;
  padding: 0.1em 0.8em;
  margin-bottom: 0.6rem;
}
.dialog__speaker:empty { display: none; }

.dialog__body { font-size: clamp(1rem, 2.6vw, 1.15rem); line-height: 1.75; }
.dialog__body p { animation: lineIn 0.45s ease both; }
.dialog__body p + p { margin-top: 0.45rem; }

.line--narration { color: rgba(255, 255, 255, 0.92); }
.line--thought   { font-style: italic; color: var(--persimmon-soft); }
.line--message {
  display: inline-block;
  background: #fff;
  color: var(--ink);
  border-radius: 4px 16px 16px 16px;
  padding: 0.55em 0.95em;
  max-width: 100%;
}
.line--dialogue::before { content: "“"; }
.line--dialogue::after { content: "”"; }
.line--question {
  position: relative;
  padding-left: 1.4em;
  color: #fff;
}
.line--question::before {
  content: "?";
  position: absolute; left: 0; top: 0.08em;
  width: 1.05em; height: 1.05em;
  border-radius: 50%;
  background: var(--persimmon);
  color: #fff;
  font-size: 0.85em;
  font-weight: 700;
  line-height: 1.05em;
  text-align: center;
  margin-top: 0.2em;
}

.dialog__hint {
  position: absolute;
  right: 1.2rem; bottom: 0.7rem;
  font-size: 0.78rem;
  color: rgba(255, 255, 255, 0.6);
}
.dialog__arrow { display: inline-block; animation: nudge 1.2s ease-in-out infinite; }

.intro__tap {
  position: absolute;
  left: 50%; bottom: 3.4rem;
  transform: translateX(-50%);
  font-size: 0.85rem;
  color: rgba(255, 255, 255, 0.7);
  opacity: 0;
  transition: opacity 0.6s ease 0.6s;
  z-index: 3;
  pointer-events: none;
}
.intro__tap.is-visible { opacity: 1; }

.intro__progress {
  position: absolute;
  bottom: 1.3rem; left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 0.5rem;
  z-index: 3;
}
.intro__progress li {
  width: 28px; height: 4px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.3);
  transition: background 0.4s;
}
.intro__progress li.is-done,
.intro__progress li.is-current { background: var(--persimmon); }

.intro.is-transitioning .dialog,
.intro.is-transitioning .intro__progress,
.intro.is-transitioning .intro__chapter,
.intro.is-transitioning .intro__headline { opacity: 0; pointer-events: none; }

.intro.is-leaving { opacity: 0; transition: opacity 0.8s ease; }

@keyframes lineIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: none; }
}
@keyframes nudge {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(4px); }
}

/* =========================================================
   Farm Hub
   ========================================================= */
.hub-wrap { animation: fadeIn 0.8s ease both; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 1rem;
  height: var(--topbar-h);
  padding: 0 clamp(1rem, 3vw, 2rem);
  background: rgba(59, 42, 30, 0.95);
  color: #fff;
  backdrop-filter: blur(6px);
}
.topbar__brand {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  font-family: var(--serif);
  font-weight: 700;
  font-size: 1.15rem;
  text-decoration: none;
  white-space: nowrap;
}
.topbar__mark {
  width: 18px; height: 18px;
  border-radius: 50% 50% 46% 46%;
  background: var(--persimmon);
  box-shadow: inset -3px -3px 0 rgba(0,0,0,0.15);
  position: relative;
}
.topbar__mark::before {
  content: "";
  position: absolute;
  top: -4px; left: 5px;
  width: 8px; height: 5px;
  border-radius: 50%;
  background: #7d9a4a;
}
.topbar__nav { flex: 1; min-width: 0; }
.topbar__nav ul {
  display: flex;
  gap: 0.25rem;
  overflow-x: auto;
  scrollbar-width: none;
}
.topbar__nav ul::-webkit-scrollbar { display: none; }
.topbar__nav a {
  display: block;
  padding: 0.4em 0.8em;
  border-radius: 999px;
  font-size: 0.9rem;
  text-decoration: none;
  white-space: nowrap;
  color: rgba(255, 255, 255, 0.85);
}
.topbar__nav a:hover { background: rgba(255,255,255,0.1); color: #fff; }
.topbar__nav a[aria-current="page"] { background: var(--persimmon); color: #fff; }

.hub {
  width: min(100% - 2rem, 1180px);
  margin: 0 auto;
  padding: clamp(1.5rem, 4vw, 2.75rem) 0 3rem;
}
.hub__intro { text-align: center; margin-bottom: 1.25rem; }
.hub__title {
  font-size: clamp(1.45rem, 3.6vw, 2.2rem);
  margin: 0.35rem 0 0.5rem;
  color: var(--soil);
}
.hub__lead { color: var(--ink-soft); }

/* 농장 운영판 스타일의 상태 표시줄 (Control Center 요소) */
.status-board {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 0.5rem 0.75rem;
  margin: 0 auto 1.25rem;
}
.status-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.5em;
  font-size: 0.85rem;
  padding: 0.3em 0.85em;
  border-radius: 999px;
  background: var(--paper);
  border: 1px solid var(--line);
  color: var(--ink-soft);
}
.status-chip strong { color: var(--ink); font-weight: 700; }
.status-chip__dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--leaf);
  flex: none;
}
.status-chip--stage .status-chip__dot { background: var(--persimmon); animation: pulse 2s ease-in-out infinite; }

/* 허브 그림 + 버튼 */
.stage {
  position: relative;
  /* 화면 높이 안에 그림 전체가 들어오도록 폭을 제한 (16:9 유지) */
  width: min(100%, max(520px, calc((100vh - 21rem) * 16 / 9)));
  margin: 0 auto;
  aspect-ratio: 16 / 9;
  border-radius: calc(var(--radius) + 4px);
  overflow: hidden;
  box-shadow: var(--shadow);
  background: #d9b98a;
}
.stage__bg { position: absolute; inset: 0; }
.stage__spots { position: absolute; inset: 0; }

.spot {
  position: absolute;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.35rem;
  padding: 0;
  border: 0;
  background: none;
  font: inherit;
  cursor: pointer;
  color: var(--ink);
}
.spot__pin {
  position: relative;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--persimmon);
  border: 3px solid #fff;
  box-shadow: 0 3px 10px rgba(0,0,0,0.35);
}
.spot__pin::after {
  content: "";
  position: absolute; inset: -9px;
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, 0.85);
  animation: ripple 2.2s ease-out infinite;
}
.spot__label {
  display: flex;
  flex-direction: column;
  align-items: center;
  line-height: 1.25;
  padding: 0.4em 0.9em;
  border-radius: 10px;
  background: rgba(255, 253, 248, 0.94);
  box-shadow: 0 6px 18px rgba(0,0,0,0.2);
  white-space: nowrap;
  transition: transform 0.2s, background 0.2s;
}
.spot__place { font-weight: 700; font-size: 0.95rem; }
.spot__doc { font-size: 0.75rem; color: var(--ink-soft); }
.spot:hover .spot__label,
.spot:focus-visible .spot__label { transform: translateY(-3px); background: #fff; }
.spot:hover .spot__pin { background: var(--persimmon-deep); }
.spot:focus-visible { outline: none; }
.spot:focus-visible .spot__label { outline: 3px solid var(--persimmon); outline-offset: 2px; }

/* ---------- 미니 탐색: 캐릭터 · 말풍선 · 안내 ---------- */
.stage { cursor: pointer; touch-action: manipulation; }
.stage:focus-visible { outline-offset: 4px; }

.player {
  position: absolute;
  width: clamp(22px, 3.4%, 44px);
  aspect-ratio: 3 / 5;
  transform: translate(-50%, -100%);   /* 좌표 = 발 위치 */
  pointer-events: none;
}
.player__shadow {
  position: absolute;
  left: 50%; bottom: -6%;
  width: 110%; height: 14%;
  transform: translateX(-50%);
  border-radius: 50%;
  background: rgba(30, 20, 10, 0.28);
}
.player__sprite {
  position: absolute;
  inset: 0;
  transform: scaleX(var(--face, 1));   /* 왼쪽으로 걸으면 좌우 반전 */
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center bottom;
}
/* 이미지(images/character.png)가 없을 때의 단순한 자리표시자 인물 */
.player:not(.has-img) .player__sprite::before {
  content: "";
  position: absolute;
  top: 4%; left: 50%;
  width: 62%;
  aspect-ratio: 1;
  transform: translateX(-50%);
  border-radius: 50%;
  background: linear-gradient(180deg, var(--persimmon) 0 40%, #f1d4b3 40%);
  box-shadow: 0 0 0 2px #fff;
}
.player:not(.has-img) .player__sprite::after {
  content: "";
  position: absolute;
  top: 42%; bottom: 0;
  left: 16%; right: 16%;
  border-radius: 45% 45% 22% 22%;
  background: var(--leaf);
  box-shadow: 0 0 0 2px #fff;
}
.player.is-walking .player__sprite { animation: bob 0.32s ease-in-out infinite alternate; }

.prompt {
  position: absolute;
  z-index: 200;
  transform: translate(-50%, -100%);
  display: inline-flex;
  align-items: center;
  gap: 0.45em;
  white-space: nowrap;
  font: inherit;
  font-size: 0.85rem;
  font-weight: 700;
  padding: 0.4em 0.9em;
  border: 0;
  border-radius: 999px;
  background: var(--soil);
  color: #fff;
  cursor: pointer;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
  animation: popIn 0.2s ease both;
}
.prompt::after {
  content: "";
  position: absolute;
  left: 50%; bottom: -5px;
  width: 10px; height: 10px;
  transform: translateX(-50%) rotate(45deg);
  background: var(--soil);
}
.prompt:hover { background: var(--persimmon-deep); }
.prompt:hover::after { background: var(--persimmon-deep); }
.prompt kbd {
  font: inherit;
  font-size: 0.72rem;
  padding: 0.05em 0.45em;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.18);
  border: 1px solid rgba(255, 255, 255, 0.35);
}

.spot.is-near .spot__label { background: var(--persimmon); color: #fff; transform: translateY(-3px); }
.spot.is-near .spot__doc { color: rgba(255, 255, 255, 0.85); }

.stage__hint {
  position: absolute;
  left: 12px; top: 12px;
  right: 12px;
  width: fit-content;
  z-index: 200;
  font-size: 0.82rem;
  padding: 0.35em 0.85em;
  border-radius: 8px;
  background: rgba(43, 32, 24, 0.78);
  color: #fff;
  pointer-events: none;
  transition: opacity 0.6s ease;
}

.sv-menu ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 0.45em; }
.sv-menu__item {
  width: 100%;
  display: flex;
  justify-content: space-between;
  gap: 1em;
  cursor: pointer;
  font-family: var(--pixel);
  font-size: 0.95em;
  color: var(--sv-text);
  background: var(--sv-parch-2);
  border: 3px solid var(--sv-dark);
  border-radius: 4px;
  padding: 0.45em 0.8em;
  text-align: left;
}
.sv-menu__item span { color: #8a4a22; }
.sv-menu__item:hover, .sv-menu__item:focus-visible { background: #fff0c8; }

.sv-window {
  width: min(100%, 760px);
  max-height: min(86vh, 720px);
  display: flex;
  flex-direction: column;
  padding: 1.1em 1.3em 1em;
  font-size: 16px;
  animation: popWin 0.22s cubic-bezier(.2, .9, .3, 1.3) both;
}
.sv-window__head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1em; }
.sv-window__sub { margin: 0; font-size: 0.85em; color: #8a4a22; }
.sv-window__title { margin: 0; font-size: 1.45em; font-weight: 400; color: var(--sv-dark); }
.sv-window__close { font-size: 0.9em; }
.sv-tab__short { display: none; }
.sv-window__tabs { flex: none; display: flex; flex-wrap: wrap; gap: 0.35em; margin: 0.7em 0 0.8em; padding-bottom: 0.7em; border-bottom: 3px dotted var(--sv-wood); }
.sv-tab {
  cursor: pointer;
  font-family: var(--pixel);
  font-size: 0.85em;
  color: var(--sv-text);
  background: var(--sv-parch-2);
  border: 2px solid var(--sv-dark);
  border-radius: 4px 4px 0 0;
  padding: 0.2em 0.7em;
}
.sv-tab[aria-pressed="true"] { background: var(--persimmon); color: #2a1206; }
.sv-window__body { overflow-y: auto; overscroll-behavior: contain; padding-right: 0.3em; font-family: var(--sans); font-size: 0.98rem; line-height: 1.7; }

/* 자료 내용 (FarmDocs) */
.doc-intro { margin: 0 0 0.9em; color: #6a3a1a; }
.doc-card { background: #fff6dc; border: 2px solid var(--sv-wood); border-radius: 6px; padding: 0.8em 1em; margin-bottom: 0.7em; }
.doc-card h4 { margin: 0 0 0.3em; font-family: var(--pixel); font-weight: 400; font-size: 1.05em; color: var(--sv-dark); }
.doc-card p { margin: 0.2em 0; }
.doc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0.7em; }
.doc-tag { display: inline-block; font-size: 0.8em; font-weight: 700; background: #e3ead3; color: #3f5424; border-radius: 999px; padding: 0.05em 0.7em; }
.doc-tag--first { background: var(--soft); color: #7a3a10; }
.doc-label { font-size: 0.8em; font-weight: 700; color: #8a5a3a; margin-top: 0.5em !important; }
.doc-quote { font-style: italic; color: #6a4a3a; }
.doc-muted { color: #8a6a50; font-size: 0.92em; }
.doc-stage { background: var(--sv-dark); color: #fff2d0; border-radius: 6px; padding: 0.6em 0.9em; margin: 0 0 0.8em; }
.doc-stage span { font-family: var(--pixel); color: #ffc070; margin-right: 0.3em; }
.doc-section { margin: 1.2em 0 0.2em; font-family: var(--pixel); font-weight: 400; font-size: 1.05em; color: var(--sv-dark); }
.doc-callout { margin: 0.2em 0 0.7em; padding: 0.6em 0.9em; border-left: 4px solid var(--persimmon); background: #fff0d8; border-radius: 4px; font-weight: 700; color: var(--sv-dark); }
.doc-checks { margin: 0.2em 0 0; padding-left: 1.2em; }
.doc-checks li { margin: 0.2em 0; }
.doc-checks li::marker { content: "✓ "; color: #5f7a3a; font-weight: 900; }
.doc-causes { margin: 0.3em 0 0.8em; background: #fff6dc; border: 2px solid var(--sv-wood); border-radius: 6px; padding: 0.6em 1em 0.6em 2.2em; }
.doc-causes li { margin: 0.35em 0; }
.doc-causes .doc-tag { margin-left: 0.2em; }
.doc-us { display: inline-block; font-family: var(--sans); font-size: 0.78em; font-weight: 700; background: #f9d6cf; color: #8a2a17; border-radius: 999px; padding: 0 0.6em; }
.doc-meta { margin-top: 0.6em !important; padding-top: 0.4em; border-top: 1px dashed var(--sv-wood); font-size: 0.9em; color: #6a3a1a; }
.doc-q { margin: 0; padding-left: 1.2em; }
.doc-q li { margin: 0.3em 0; }
.doc-q li::marker { content: "? "; color: var(--persimmon); font-weight: 900; }
.doc-level { font-family: var(--sans); font-size: 0.75em; font-weight: 700; background: #e3ead3; border-radius: 999px; padding: 0 0.6em; margin-left: 0.4em; }
.doc-level[data-level="높음"] { background: #f9d6cf; color: #8a2a17; }
.doc-level[data-level="중간"] { background: var(--soft); color: #7a3a10; }
/* docs/*.md 문서 (Questions · Premortem · Project Overview) */
.md { word-break: keep-all; overflow-wrap: break-word; }
.md > :first-child { margin-top: 0; }
.md h1, .md h2, .md h3, .md h4 { font-family: var(--pixel); font-weight: 400; color: var(--sv-dark); line-height: 1.4; }
.md h1 { font-size: 1.25em; margin: 1.3em 0 0.4em; padding-bottom: 0.25em; border-bottom: 3px dotted var(--sv-wood); }
.md h2 { font-size: 1.1em; margin: 1.3em 0 0.35em; padding: 0.2em 0.6em; background: #f3dcb0; border-left: 5px solid var(--persimmon); border-radius: 3px; }
.md h3 { font-size: 1em; margin: 1.1em 0 0.3em; color: #7a3a10; }
.md h4 { font-size: 0.95em; margin: 0.9em 0 0.25em; }
.md p { margin: 0.4em 0; }
.md ul, .md ol { margin: 0.3em 0 0.6em; padding-left: 1.4em; }
.md ul { list-style: disc; }
.md ol { list-style: decimal; }
.md li ul { list-style: circle; }
.md li { margin: 0.25em 0; }
.md li::marker { color: var(--persimmon); }
.md strong { color: #5a2a0a; }
.md a { color: #8a3a10; font-weight: 700; }
.md code { font-size: 0.9em; background: #f3e2c0; border-radius: 3px; padding: 0 0.3em; }
.md pre { background: #2a1a10; color: #fff2d0; padding: 0.7em 0.9em; border-radius: 6px; overflow-x: auto; }
.md pre code { background: none; padding: 0; }
.md hr { border: 0; border-top: 2px dashed var(--sv-wood); margin: 1.1em 0; }
.md blockquote { margin: 0.6em 0; padding: 0.4em 0.9em; background: #fff0d8; border-left: 4px solid var(--persimmon); border-radius: 4px; }
.md .md-table { overflow-x: auto; margin: 0.5em 0 0.8em; }
.md table { border-collapse: collapse; width: 100%; font-size: 0.9em; background: #fff6dc; }
.md th, .md td { border: 1px solid #d9b98a; padding: 0.35em 0.55em; text-align: left; vertical-align: top; }
.md th { background: #f3dcb0; font-weight: 700; white-space: nowrap; }

/* 팀원 카드 — 4명이 한 줄에 같은 크기로 (좁은 화면은 2열 → 1열) */
.sv-window:has(.doc-team) { width: min(100%, 980px); }
.doc-grid.doc-team { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.doc-team .doc-card { display: flex; flex-direction: column; margin-bottom: 0; }
.doc-card--pending { border-style: dashed; background: rgba(255, 246, 220, 0.6); }
.doc-member { display: flex; flex-direction: column; align-items: center; gap: 0.4em; text-align: center; }
.doc-face { flex: none; width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--sv-wood); object-fit: cover; background: var(--soft); }
.doc-face--initial { display: grid; place-items: center; font-family: var(--pixel); font-size: 1.4em; color: #7a3a10; }
.doc-card--pending .doc-face { border-style: dashed; background: transparent; }
.doc-keys { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.3em; list-style: none; margin: 0.5em 0 0.4em; padding: 0; }
.doc-keys li { font-size: 0.75em; font-weight: 700; color: #6a3a1a; background: #fffaf0; border: 1px solid var(--sv-wood); border-radius: 999px; padding: 0 0.6em; }
.doc-team .doc-quote { margin-bottom: 0.6em; }
/* 팀원 카드 본문: 조금 작게, 단어 중간에서 줄이 끊기지 않게(keep-all), 줄 끝을 고르게 */
.doc-team .doc-card > p:not(.doc-link) { font-size: 0.86em; line-height: 1.65; word-break: keep-all; overflow-wrap: break-word; text-wrap: pretty; }
.doc-team .doc-quote { font-size: 0.82em !important; color: #7a5a40; }
.doc-team .doc-card h4 { word-break: keep-all; }
/* 직무 + 과정: 같은 초록 칸 안에 두 줄. 줄이 넘치면 글자를 줄여 두 줄에 맞춤(js/v1-farm.js fitRoles) */
.doc-role { display: inline-flex; flex-direction: column; align-items: center; max-width: 100%; border-radius: 10px; padding: 0.2em 0.8em; line-height: 1.35; }
.doc-role span { display: block; max-width: 100%; white-space: nowrap; }
.doc-role span + span { font-size: 0.92em; opacity: 0.85; }
.doc-link { margin-top: auto !important; padding-top: 0.4em; border-top: 1px dashed var(--sv-wood); font-size: 0.88em; font-weight: 700; }
@media (max-width: 900px) {
  .doc-grid.doc-team { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  .doc-grid.doc-team { grid-template-columns: 1fr; }
  .doc-member { flex-direction: row; text-align: left; gap: 0.7em; }
  .doc-face { width: 56px; height: 56px; }
  .doc-keys { justify-content: flex-start; }
}
.doc-link a { color: #8a3a10; }
.doc-empty { text-align: center; padding: 1.6em 1em; border: 3px dashed var(--sv-wood); border-radius: 8px; background: rgba(255, 246, 220, 0.6); }
.doc-empty strong { display: block; font-family: var(--pixel); font-weight: 400; font-size: 1.15em; color: var(--sv-dark); margin-bottom: 0.3em; }
.doc-empty p { margin: 0; color: #7a5a40; }
.doc-list { display: inline-block; text-align: left; margin: 0.8em 0 0; padding-left: 1.2em; color: #6a4a3a; }

/* 아래 안내 · 바로가기 */
.sv-below { width: min(100%, 1100px); margin: 18px auto 0; color: #f3dcb4; text-align: center; }
.sv-help { margin: 0 0 12px; font-size: 0.85rem; }
.sv-help kbd { font-family: var(--pixel); background: #4a2c18; border: 2px solid #8a5a3a; border-radius: 3px; padding: 0 0.35em; color: #fff2d0; }
.sv-quick { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.sv-quick__btn {
  width: 100%;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 0.15em;
  font-family: var(--pixel);
  font-size: 0.95rem;
  color: var(--sv-text);
  background: var(--sv-parch);
  border: 3px solid var(--sv-dark);
  border-radius: 6px;
  box-shadow: inset 0 0 0 2px var(--sv-wood-2), 3px 4px 0 rgba(0, 0, 0, 0.4);
  padding: 0.6em 0.8em;
}
.sv-quick__btn span { font-size: 0.78em; color: #8a4a22; }
.sv-quick__btn:hover { background: #fff0c8; }

/* =========================================================
   탐방 표시 · 자료 열기 효과
   ========================================================= */
/* 라벨 오른쪽 위 모서리 '!'(아직 안 봄, 통통 튐) / '✓'(봤음) — 화면 맨 위 라벨에서도 잘리지 않게 모서리에 */
.sv-badge {
  position: absolute; right: -1.05em; top: -0.8em;
  width: 1.5em; height: 1.5em; display: grid; place-items: center;
  font-family: var(--pixel); font-size: 1.4em; font-weight: 700; line-height: 1;
  color: #2a1206; background: #ffd23f; border: 2px solid var(--sv-dark); border-radius: 50%;
  box-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
  animation: badgeHop 0.9s ease-in-out infinite;
}
.sv-label.is-edge-right .sv-badge { right: auto; left: -1.05em; }
.sv-badge[hidden] { display: none; }

/* 감 따기 체험 안내서 바 (농장 바로 아래) */
.sv-game {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0.5em 1.1em;
  margin: 0 auto 12px; padding: 0.55em 1em; width: fit-content; max-width: 100%;
  font-family: var(--pixel); font-size: 0.9rem; color: var(--sv-text);
  background: var(--sv-parch); border: 3px solid var(--sv-dark); border-radius: 8px;
  box-shadow: inset 0 0 0 2px var(--sv-wood-2), 3px 4px 0 rgba(0, 0, 0, 0.4);
  animation: popWin 0.25s cubic-bezier(.2, .9, .3, 1.3) both;
}
.sv-game[hidden] { display: none; }
.sv-game__head { margin: 0; }
.sv-game__head b { color: #8a3a10; font-weight: 400; }
.sv-game__steps { display: flex; flex-wrap: wrap; gap: 0.2em 0.9em; margin: 0; padding: 0; list-style: none; counter-reset: st; }
.sv-game__steps li { counter-increment: st; color: #9a7a5a; }
.sv-game__steps li::before { content: counter(st) ". "; }
.sv-game__steps li.is-done { color: #3f6a1a; }
.sv-game__steps li.is-done::before { content: "✓ "; }
.sv-game__steps li.is-now { color: var(--sv-dark); background: #ffd23f; border-radius: 4px; padding: 0 0.35em; }
.sv-game__count { display: flex; align-items: center; gap: 0.25em; }
.sv-game__count span:last-child { margin-left: 0.3em; }
.sv-game__dot { width: 0.85em; height: 0.85em; border-radius: 50%; border: 2px solid #b4541a; background: transparent; }
.sv-game__dot.is-on { background: #e07a2e; animation: badgePop 0.35s cubic-bezier(.2, .9, .3, 1.5) both; }
.sv-game__btn { font-size: 0.85em; padding: 0.15em 0.7em; }
.sv-badge.is-done { background: #9ccf6a; animation: badgePop 0.4s cubic-bezier(.2, .9, .3, 1.5) both; }
@keyframes badgeHop { 0%, 100% { translate: 0 0; } 45% { translate: 0 -5px; } 60% { translate: 0 -5px; } }
@keyframes badgePop { from { scale: 0.3; } to { scale: 1; } }
/* 아래 바로가기 버튼에도 봤음 표시 */
.sv-quick__btn, .sv-menu__item { position: relative; }
.sv-quick__btn.is-visited::after, .sv-menu__item.is-visited::after {
  content: "✓"; position: absolute; top: 0.35em; right: 0.5em;
  font-size: 0.85em; font-weight: 700; color: #3f6a1a;
}
/* 자료를 열 때 그 장소 쪽으로 화면이 다가감 */
.sv-canvas { transition: transform 0.3s cubic-bezier(.4, 0, .2, 1); transform-origin: var(--zx, 50%) var(--zy, 50%); }
.sv-stage.is-zooming .sv-canvas { transform: scale(1.45); }
.sv-labels { transition: opacity 0.2s ease; }
.sv-stage.is-zooming .sv-labels, .sv-stage.is-zooming .sv-prompt { opacity: 0; }
/* 자료 창 내용이 차례로 떠오름 */
.doc-in { animation: docIn 0.42s cubic-bezier(.2, .8, .3, 1) both; }
@keyframes docIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .sv-badge, .sv-badge.is-done, .doc-in { animation: none; }
  .sv-canvas { transition: none; }
}

/* =========================================================
   인트로 그림 패널 (WebtoonArt) — 대화창 위, 화면 가운데
   ========================================================= */
.intro__art {
  position: absolute;
  left: 50%; top: 4.6rem;
  transform: translateX(-50%);
  width: min(calc(100% - 2rem), 820px, calc((100vh - 20.5rem) * 16 / 9));
  width: min(calc(100% - 2rem), 820px, calc((100svh - 20.5rem) * 16 / 9));
  aspect-ratio: 16 / 9;
  z-index: 1;
  pointer-events: none;
  transition: opacity 0.5s ease;
}
.intro__art.is-hidden { opacity: 0; }
/* 과수원 길 전환: 밝은 그림 위에서도 읽히도록 자막에 어두운 띠, 간판과 겹치지 않게 위로 */
.intro__caption { top: 27%; width: auto; max-width: min(90%, 820px); padding: 0.45em 1.3em 0.55em; border-radius: 14px; background: rgba(32, 18, 10, 0.58); backdrop-filter: blur(4px); }
.intro.is-transitioning .intro__art { opacity: 0; }
.intro__panel {
  position: absolute; inset: 0;
  border-radius: 14px; overflow: hidden;
  background: #fffdf8;
  border: 3px solid rgba(255, 236, 214, 0.9);
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  animation: artIn 0.6s cubic-bezier(.2, .8, .3, 1) both;
}
.intro__panel svg { display: block; width: 100%; height: 100%; animation: artDrift 9s ease-out both; }
.intro__panel.fx-shake { animation: artIn 0.6s cubic-bezier(.2, .8, .3, 1) both, artShake 0.5s 0.35s ease-in-out 2; }
.intro__panel.is-out { animation: artOut 0.45s ease both; }
.intro__panel--trio {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8rem; align-content: center;
  background: none; border: 0; box-shadow: none; overflow: visible;
}
.intro__cell {
  aspect-ratio: 1 / 1; border-radius: 12px; overflow: hidden; background: #fffdf8;
  border: 3px solid rgba(255, 236, 214, 0.9); box-shadow: 0 14px 36px rgba(0, 0, 0, 0.4);
  animation: cellIn 0.5s cubic-bezier(.2, .9, .3, 1.3) both;
}
.intro__cell:nth-child(2) { animation-delay: 0.35s; }
.intro__cell:nth-child(3) { animation-delay: 0.7s; }
.intro__cell svg { display: block; width: 100%; height: 100%; }
@keyframes artIn { from { opacity: 0; transform: translateY(14px) scale(0.97); } to { opacity: 1; transform: none; } }
@keyframes artOut { to { opacity: 0; transform: translateY(-10px) scale(1.02); } }
@keyframes artDrift { from { transform: scale(1); } to { transform: scale(1.05); } }
@keyframes artShake { 0%, 100% { translate: 0 0; } 20% { translate: -6px 0; rotate: -1deg; } 40% { translate: 6px 0; rotate: 1deg; } 60% { translate: -4px 0; } 80% { translate: 4px 0; } }
@keyframes cellIn { from { opacity: 0; transform: translateY(18px) scale(0.85); } to { opacity: 1; transform: none; } }
@media (max-width: 720px) {
  .intro__art { top: 6.4rem; width: min(calc(100% - 1.5rem), calc((100svh - 22rem) * 16 / 9)); }
  .intro__panel--trio { gap: 0.4rem; }
}
@media (prefers-reduced-motion: reduce) {
  .intro__panel, .intro__panel svg, .intro__cell, .intro__panel.is-out, .intro__panel.fx-shake { animation: none; }
}

@keyframes svBounce { to { translate: 0 -3px; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes popWin { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: none; } }

/* =========================================================
   반응형
   ========================================================= */
.sv-help--touch { display: none; }
@media (hover: none) and (pointer: coarse) {        /* 터치 기기: 키보드 안내 대신 터치 안내 */
  .sv-help--keys { display: none; }
  .sv-help--touch { display: block; }
}

@media (max-width: 720px) {
  /* 농장 화면을 세로 가운데에 두고, 버튼은 그림을 가리지 않게 그림 아래로 */
  .sv { padding: 14px 10px 24px; display: flex; flex-direction: column; justify-content: center; }
  .sv-stage { min-width: 100%; border-width: 3px; overflow: visible; font-size: 11px; }
  .sv-canvas { border-radius: 1px; }
  .sv-labels, .sv-pops { overflow: hidden; }
  .sv-hud { top: calc(100% + 14px); bottom: auto; left: 0; right: 0; justify-content: center; gap: 6px; font-size: 13px; }
  .sv-hud .sv-btn { padding: 0.35em 0.7em; }
  .sv-clock { top: 3%; right: 2%; min-width: 0; padding: 0.15em 0.45em 0.2em; font-size: 0.78em; border-width: 2px; }
  .sv-clock__day { display: none; }
  .sv-clock__place { display: none; }
  .sv-label { font-size: 0.82em; padding: 0.05em 0.45em; border-width: 1px; }
  .sv-label small { display: none; }
  .sv-prompt { font-size: 1em; }
  .sv-msg { font-size: 1.05em; padding: 0.6em 0.9em; }
  .sv-below { margin-top: 62px; }
  .sv-help { font-size: 0.82rem; line-height: 1.5; padding: 0 4px; }
  .sv-quick { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .sv-quick__btn { padding: 0.55em 0.5em; font-size: 0.92rem; }

  /* 자료 창: 화면을 넓게 쓰고, 탭은 한 줄로(넘치면 옆으로 밀기) */
  .sv-overlay { padding: 10px; }
  .sv-window { font-size: 15px; padding: 0.85em 0.85em 0.7em; max-height: 92vh; max-height: 92svh; }
  .sv-window__title { font-size: 1.25em; }

/* js/sfx.js */
/* =========================================================

  function tone(type, f1, f2, at, dur, vol) {

    if (f2 && f2 !== f1) o.frequency.exponentialRampToValueAtTime(f2, t + dur);

    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  var buttons = [];

        if (m.pending) {

        }
        var link = has(m.link) && /^https?:\/\//.test(m.link) ? m.link : '';
        return '<article class="doc-card"><div class="doc-member">' + face(m) + '<div><h4>' + esc(m.name) + '</h4>' +
          (has(m.role) || has(m.program) ? '<p class="doc-tag doc-role">' +
            (has(m.role) ? '<span>' + esc(m.role) + '</span>' : '') + (has(m.program) ? '<span>' + esc(m.program) + '</span>' : '') + '</p>' : '') +
          '</div></div>' +
          (m.keywords.length ? '<ul class="doc-keys">' + m.keywords.map(function (k) { return '<li>' + esc(k) + '</li>'; }).join('') + '</ul>' : '') +
          (has(m.summary) ? '<p>' + esc(m.summary) + '</p>' : '') +
          (has(m.perspective) ? '<p class="doc-label">이 문제를 바라보는 관점</p><p>' + esc(m.perspective) + '</p>' : '') +

          (link ? '<p class="doc-link"><a href="' + esc(link) + '" target="_blank" rel="noopener">개인 페이지 ↗</a></p>' : '') +
          '</article>';
      }).join('') + '</div>';
  }

  function render(id, text) {
    if (id === 'team') return renderTeam(text);
    if (!has(text)) return empty(find(id).title + ' 준비 중', '팀이 직접 작성한 뒤 공개됩니다.');

  }

  function errorHtml(id) {

    ui.menuList.innerHTML = FarmDocs.list.map(function (d) {
      return '<li><button type="button" class="sv-menu__item" data-doc="' + d.id + '"><span>' + FarmDocs.esc(d.place) + '</span><b>' + FarmDocs.esc(d.title) + '</b></button></li>';
    }).join('');
  }

  function openDoc(id, opener) {
    var doc = FarmDocs.find(id);
    if (!doc) return;
    if (!currentDoc) lastFocus = opener || document.activeElement;
    if (currentDoc !== id) sfx(currentDoc ? 'select' : 'open');
    currentDoc = id;
    paused = true; keys = {}; path = null;
    closeMenu(true);
    ui.win.hidden = false;
    ui.winSub.textContent = doc.place;
    ui.winTitle.textContent = doc.title;
    Array.prototype.forEach.call(ui.winTabs.children, function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-doc') === id)); });
    ui.winBody.innerHTML = '<p class="doc-muted">불러오는 중…</p>';
    ui.winBody.scrollTop = 0;
    visited[id] = true; refreshBadges();
    FarmDocs.load(id).then(function (d) { if (currentDoc === id) { ui.winBody.innerHTML = FarmDocs.render(id, d); fitRoles(ui.winBody); staggerIn(ui.winBody); } })
      .catch(function () { if (currentDoc === id) ui.winBody.innerHTML = FarmDocs.errorHtml(id); });

  // 자료 창 내용이 위에서부터 차례로 떠오르게 (카드 묶음은 카드 하나씩)
  function staggerIn(box) {
    if (PX.reduceMotion) return;
    var items = [];
    Array.prototype.forEach.call(box.children, function (c) {
      if (c.classList.contains('doc-grid') || c.classList.contains('md')) items.push.apply(items, c.children); else items.push(c);
    });
    items.forEach(function (c, i) { c.style.animationDelay = (Math.min(i, 12) * 0.05) + 's'; c.classList.add('doc-in'); });
  }
  // 팀원 직무 칸: 한 줄이 칸보다 길면 글자를 조금씩 줄여 한 줄에 맞춤 (최소 70%)
  function fitRoles(box) {
    Array.prototype.forEach.call(box.querySelectorAll('.doc-role span'), function (sp) {
      sp.style.fontSize = '';
      var max = sp.parentNode.parentNode.clientWidth - 16, size = 100;
      while (sp.scrollWidth > max && size > 70) { size -= 5; sp.style.fontSize = size + '%'; }
    });
  }

  function closeDoc(silent) {
    if (!currentDoc) return;
    if (!silent) sfx('close');
    currentDoc = null;
    ui.win.hidden = true;
    paused = false;
    unzoom();
    checkTour();
    if (handlers.onDoc) handlers.onDoc(null);
    if (!silent) (lastFocus && document.contains(lastFocus) ? lastFocus : stage).focus({ preventScroll: true });
    lastFocus = null;
  }

  function openMenu() { sfx('select'); ui.menu.hidden = false; ui.menuBtn.setAttribute('aria-expanded', 'true'); paused = true; var f = ui.menuList.querySelector('button'); if (f) f.focus(); }
  function closeMenu(silent) {
    if (ui.menu.hidden) return;
    ui.menu.hidden = true; ui.menuBtn.setAttribute('aria-expanded', 'false');
    if (!currentDoc) paused = false;
    if (!silent) ui.menuBtn.focus();
  }

  /* =========================================================
     라벨 · 프롬프트
     ========================================================= */
  var labelEls = [];
  function buildLabels() {
    ui.labels.innerHTML = '';
    labelEls = scene.places.filter(function (p) { return !p.nolabel; }).map(function (p) {
      var el = document.createElement('span');
      el.className = 'sv-label';
      el.innerHTML = FarmDocs.esc(p.label) + (p.sub ? '<small>' + FarmDocs.esc(p.sub) + '</small>' : '');
      var doc = scene.id === 'farm' ? placeDoc(p) : null, badge = null;
      if (doc || p.game) { badge = document.createElement('span'); badge.className = 'sv-badge'; el.appendChild(badge); }
      ui.labels.appendChild(el);
      return { el: el, p: p, doc: doc, badge: badge };
    });
    refreshBadges();
  }
  function toScreen(wx, wy) { return { x: (wx - cam.x) / VW * 100, y: (wy - cam.y) / VH * 100 }; }
  function updateOverlay() {
    labelEls.forEach(function (l) {
      var s = toScreen(l.p.lx, l.p.ly);
      l.el.style.left = s.x + '%'; l.el.style.top = s.y + '%';
      var off = l.p.game === 'basket' && game.phase === 'idle' && !game.cleared;   // 체험 시작 전엔 바구니 라벨 숨김
      l.el.style.display = off || s.x < -10 || s.x > 110 || s.y < 4 || s.y > 105 ? 'none' : '';
      l.el.classList.toggle('is-near', near === l.p);
      l.el.classList.toggle('is-edge-right', s.x > 70);   // 오른쪽 위 시계에 배지가 가리지 않게
    });
    if (near && !trans && !paused) {
      var s = toScreen(player.x, player.y - heroH() - 4);
      ui.prompt.style.left = s.x + '%'; ui.prompt.style.top = s.y + '%';
      ui.prompt.innerHTML = (near.nolabel ? '' : FarmDocs.esc(near.label) + ' ') + near.verb + ' <kbd>Enter</kbd>';
      ui.prompt.hidden = false;
    } else ui.prompt.hidden = true;
  }
  function findNear() {
    var best = null, bd = 18 * 18;
    scene.places.forEach(function (p) {
      if (p.game === 'basket' && game.phase !== 'carry') return;   // 바구니는 감을 다 모았을 때만 안내
      var dx = p.sx - player.x, dy = p.sy - player.y, d = dx * dx + dy * dy; if (d < bd) { bd = d; best = p; } });
    return best;
  }

  /* =========================================================
     시계 (분위기용) — 7초마다 10분
     ========================================================= */
  var clock = { min: 9 * 60, acc: 0 };
  function updateClock(dt) {
    clock.acc += dt;
    if (clock.acc >= 7) { clock.acc = 0; clock.min = (clock.min + 10) % (24 * 60); renderClock(); }
  }
  function renderClock() {
    var h = Math.floor(clock.min / 60), m = clock.min % 60;
    ui.time.textContent = (h < 12 ? '오전 ' : '오후 ') + (h % 12 === 0 ? 12 : h % 12) + ':' + (m < 10 ? '0' : '') + m;
    renderDay();
  }
  // 날짜는 실제 한국 시간(Asia/Seoul) 기준 — 예: 10월 15일 (수)
  function renderDay() {
    var txt;
    try {
      var parts = {};
      new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric', weekday: 'short' })
        .formatToParts(new Date()).forEach(function (p) { parts[p.type] = p.value; });
      txt = parts.month + '월 ' + parts.day + '일 (' + parts.weekday + ')';
    } catch (e) {
      var k = new Date(Date.now() + 9 * 3600 * 1000);   // Intl을 못 쓰는 브라우저: UTC+9로 직접 계산
      txt = (k.getUTCMonth() + 1) + '월 ' + k.getUTCDate() + '일 (' + '일월화수목금토'.charAt(k.getUTCDay()) + ')';
    }
    if (ui.day.textContent !== txt) ui.day.textContent = txt;
  }

  /* =========================================================
     효과 (연기 · 물결 · 불 · 낙엽)  — 감·트럭·물고기 기믹은 아래 '농장 기믹'
     ========================================================= */
  var smoke = [], smokeAcc = 0, leaves = [];
  var LEAF_C = ['#d9772f', '#c04a30', '#e8b040', '#b8862a'];
  (function () { var rnd = PX.rng(77); for (var i = 0; i < 22; i++) leaves.push({ x: rnd() * VW, y: rnd() * VH, s: 8 + rnd() * 10, p: rnd() * 6, c: LEAF_C[i % 4] }); })();
  // 바람: 18~30초마다 3초 동안 옆으로 불며 왼쪽에서 낙엽이 더 날아듦
  var wind = { timer: 12, left: 0 };
  function updateWind(dt) {
    if (!gimOn || scene.id !== 'farm') return 0;
    if (wind.left > 0) wind.left -= dt;
    else if ((wind.timer -= dt) <= 0) {
      wind.timer = rand(18, 30); wind.left = 3;
      for (var i = 0; i < 14; i++) leaves.push({ x: -rand(4, 120), y: rand(0, VH * 0.8), s: 6 + Math.random() * 8, p: Math.random() * 6, c: LEAF_C[i % 4], gust: true });
    }
    return wind.left > 0 ? Math.min(1, wind.left, 3 - wind.left) : 0;
  }

  function updateFx(dt) {
    if (scene.smoke) {
      smokeAcc += dt;
      if (smokeAcc > 0.45) { smokeAcc = 0; scene.smoke.forEach(function (s) { smoke.push({ x: s.x, y: s.y, life: 0 }); }); }
    }
    smoke.forEach(function (p) { p.life += dt; p.y -= dt * 9; p.x += dt * 5 + Math.sin(p.life * 3) * 0.15; });
    smoke = smoke.filter(function (p) { return p.life < 3; });
    var w = updateWind(dt);
    if (scene.id === 'farm') leaves.forEach(function (l) {
      l.y += dt * l.s * (1 + w * 0.6); l.x += Math.sin(t * 1.5 + l.p) * dt * 10 + w * dt * (70 + l.s * 3);
      if (l.y > VH + 4 || l.x > VW + 8) { if (l.gust) l.dead = true; else { l.y = -4; l.x = Math.random() * VW; } }
    });
    leaves = leaves.filter(function (l) { return !l.dead; });
    confetti.forEach(function (c) { c.life += dt; c.vy += 120 * dt; c.x += c.vx * dt; c.y += c.vy * dt; });
    confetti = confetti.filter(function (c) { return c.life < 2.4; });
  }

  function drawFx() {
    var r = function (x, y, w, h, c) { PX.rect(ctx, x, y, w, h, c); };
    if (scene.water) {
      var wtr = scene.water;
      for (var k = 0; k < 7; k++) {
        var yy = wtr.cy - wtr.ry + 6 + k * 7, off = Math.sin(t * 1.4 + k * 1.7) * 12;
        var half = wtr.rx * Math.sqrt(Math.max(0, 1 - Math.pow((yy - wtr.cy) / wtr.ry, 2))) - 10;
        if (half < 6) continue;
        r(wtr.cx + off - 5 - cam.x, yy - cam.y, 10, 1, '#8cc4f0');
        if (k % 2) r(wtr.cx - off * 0.7 + 14 - cam.x, yy + 3 - cam.y, 5, 1, '#6aa8e0');
      }
    }
    smoke.forEach(function (p) {
      var a = Math.max(0, 0.55 - p.life * 0.18), sz = 3 + Math.floor(p.life * 1.5);
      ctx.fillStyle = 'rgba(220,220,225,' + a.toFixed(2) + ')';
      ctx.fillRect(Math.round(p.x - cam.x), Math.round(p.y - cam.y), sz, sz);
    });
    if (scene.fires) scene.fires.forEach(function (f) {
      for (var i = 0; i < 4; i++) {
        var hgt = 8 + Math.round(Math.abs(Math.sin(t * 9 + i * 1.9)) * 9);
        r(f.x - 10 + i * 6 - cam.x, f.y - hgt - cam.y, 5, hgt, i % 2 ? '#f0a020' : '#e05a20');
        r(f.x - 9 + i * 6 - cam.x, f.y - Math.round(hgt * 0.5) - cam.y, 3, Math.round(hgt * 0.5), '#ffe080');
      }
      ctx.fillStyle = 'rgba(255,180,80,' + (0.12 + Math.sin(t * 6) * 0.03).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(f.x - cam.x, f.y - 10 - cam.y, 46, 0, Math.PI * 2); ctx.fill();
    });
  }

  function drawLeaves() {
    if (scene.id === 'farm') leaves.forEach(function (l) {
      var flip = Math.sin(t * 3 + l.p) > 0;           // 뒤집히며 떨어지는 감잎 (몸통 + 끝 1픽셀)
      if (flip) { PX.rect(ctx, l.x, l.y, 4, 2, l.c); PX.rect(ctx, l.x + 4, l.y + 1, 1, 1, l.c); }
      else { PX.rect(ctx, l.x, l.y, 2, 4, l.c); PX.rect(ctx, l.x + 1, l.y + 4, 1, 1, l.c); }
    });
    confetti.forEach(function (c) {
      if (c.life > 1.9 && Math.floor(c.life * 12) % 2) return;   // 사라질 때 깜빡
      PX.rect(ctx, c.x - cam.x, c.y - cam.y, c.w, c.h, c.c);
    });
  }

  /* 탐방 완료 축하: 주인공 머리 위에서 감·잎 조각이 터져 나옴 */
  var confetti = [];
  function celebrate(text) {
    var cx = player.x, cy = player.y - heroH();
    pop(text || '탐방 완료!', cx, cy - 4);
    if (PX.reduceMotion) return;
    for (var i = 0; i < 70; i++) {
      var a = -Math.PI / 2 + (Math.random() - 0.5) * 2.6, v = 70 + Math.random() * 110;
      confetti.push({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: Math.random() * 0.3,
        w: Math.random() < 0.5 ? 3 : 4, h: 3, c: ['#ffd23f', '#ffffff', '#e07a2e', '#9ccf6a', '#ff8fa3'][i % 5] });
    }
  }

  /* =========================================================
     농장 기믹 (바깥 농장에서만) — 떨어지는 감 · 지나가는 트럭 · 뛰어오르는 물고기
     - 간격(초)은 아래 GIM 값으로 조절
     - '움직임 줄이기' 설정을 켠 사용자에게는 나오지 않음
     ========================================================= */
  var GIM = {
    fruitEvery: [5, 9],      // 감이 떨어지는 간격
    fruitMax: 4,             // 땅에 동시에 놓여 있을 수 있는 감
    truckFirst: [24, 28],    // 농장에 들어온 뒤 첫 트럭
    truckEvery: [30, 40],    // 그다음 트럭 간격
    fishEvery: [4, 7]        // 물고기 간격
  };
  var gimOn = !PX.reduceMotion;
  function rand(a, b) { return a + Math.random() * (b - a); }
  function quiet() { return paused || !!trans || scene.id !== 'farm'; }   // 자료 창을 볼 때는 소리 내지 않음

  // --- 감 ---
  var fruits = [], fruitTimer = rand(2, 4);
  function updateFruits(dt) {
    var trees = scene.fruitTrees;
    if (!trees) return;
    fruitTimer -= dt;
    if (gimOn && fruitTimer <= 0 && fruits.length < GIM.fruitMax) {
      fruitTimer = rand(GIM.fruitEvery[0], GIM.fruitEvery[1]);
      var tr = trees[Math.floor(Math.random() * trees.length)];
      fruits.push({ x: tr[0] + rand(-9, 9), y: tr[1] - rand(18, 26), ground: tr[1] + rand(1, 4), vy: 0, vx: 0, bounced: false, state: 'fall', life: 0, roll: 0 });
    }
    fruits.forEach(function (f) {
      if (f.state === 'fall') {
        f.vy += (f.slow ? 110 : 260) * dt; f.y += f.vy * dt;
        if (f.y >= f.ground) {
          f.y = f.ground;
          if (!f.bounced) {
            f.bounced = true; f.vy = -f.vy * 0.32; f.vx = (Math.random() < 0.5 ? -1 : 1) * rand(16, 26);
            if (!quiet()) sfx('plop');
          } else { f.vy = 0; f.state = 'roll'; }
        }
        f.x += f.vx * dt; f.roll += Math.abs(f.vx) * dt;
      } else if (f.state === 'roll') {
        var s = Math.max(0, Math.abs(f.vx) - 34 * dt);
        f.vx = f.vx < 0 ? -s : s; f.x += f.vx * dt; f.roll += s * dt;
        if (!s) { f.state = 'rest'; f.life = 0; }
      } else { f.life += dt; }
    });
    fruits = fruits.filter(function (f) { return f.state !== 'rest' || f.life < (f.slow ? 12 : 7); });
  }
  function drawFruit(f) {
    var x = Math.round(f.x - 2 - cam.x), y = Math.round(f.y - 4 - cam.y);
    var fade = f.slow ? 11 : 6;
    if (f.state === 'rest' && f.life > fade) ctx.globalAlpha = Math.max(0, fade + 1 - f.life);
    if (f.state !== 'fall') { ctx.fillStyle = 'rgba(40,25,10,0.28)'; ctx.fillRect(x, y + 4, 4, 1); }
    PX.rect(ctx, x + 1, y, 2, 4, '#e07a2e');          // 둥근 4x4 감
    PX.rect(ctx, x, y + 1, 4, 2, '#e07a2e');
    PX.rect(ctx, x + 1, y + 1, 1, 1, '#f8c07a');      // 하이라이트
    PX.rect(ctx, x + 2, y + 3, 1, 1, '#b4541a');
    PX.rect(ctx, x + 3, y + 2, 1, 1, '#b4541a');
    var k = Math.floor(f.roll / 2) % 4, cal = [[1, -1], [4, 1], [2, 4], [-1, 2]][k];   // 꼭지가 돌아가며 구르는 느낌
    PX.rect(ctx, x + cal[0], y + cal[1], k % 2 ? 1 : 2, k % 2 ? 2 : 1, '#4f6a2a');
    ctx.globalAlpha = 1;
  }

  // --- 트럭 (아래쪽 울타리 바깥) ---
  var truckImg = (function () {
    var W = 36, H = 17, o = PX.offscreen(W, H), c = o.ctx, r = function (x, y, w, h, col) { PX.rect(c, x, y, w, h, col); };
    // 짐칸 + 감 상자
    r(2, 3, 8, 4, '#b5763a'); r(2, 3, 8, 1, '#d39a5a'); r(11, 4, 8, 3, '#a8692f'); r(11, 4, 8, 1, '#c98d4c');
    [[3, 2], [5, 2], [7, 2], [12, 3], [14, 3], [16, 3], [4, 1], [6, 1], [13, 2], [15, 2]].forEach(function (p) { r(p[0], p[1], 2, 1, '#e07a2e'); });
    r(1, 7, 20, 5, '#4f86b8'); r(1, 7, 20, 1, '#79a9d4'); r(1, 11, 20, 1, '#2f5a85');
    // 운전석
    r(20, 1, 10, 11, '#4f86b8'); r(20, 1, 10, 1, '#79a9d4'); r(22, 3, 6, 4, '#c6e6f4'); r(22, 3, 2, 4, '#e8f6fb');
    // 보닛 · 범퍼 · 전조등
    r(30, 6, 5, 6, '#4f86b8'); r(30, 6, 5, 1, '#79a9d4'); r(34, 7, 1, 2, '#ffe9a0'); r(29, 11, 7, 1, '#2f5a85'); r(0, 11, 2, 1, '#2f5a85');
    r(0, 12, 36, 1, '#26323c');
    // 바퀴
    [7, 27].forEach(function (cx) { PX.disc(c, cx, 13, 3, '#2a2220'); r(cx - 1, 12, 2, 2, '#9a9a9a'); });
    var m = PX.offscreen(W, H);            // 왼쪽으로 가는 트럭은 좌우 반전
    m.ctx.translate(W, 0); m.ctx.scale(-1, 1); m.ctx.drawImage(o.canvas, 0, 0);
    return { right: o.canvas, left: m.canvas, w: W, h: H };
  })();
  var truck = null, truckTimer = rand(GIM.truckFirst[0], GIM.truckFirst[1]), dust = [];
  function updateTruck(dt) {
    if (!truck) {
      truckTimer -= dt;
      if (truckTimer <= 0) {
        if (quiet()) { truckTimer = 3; return; }        // 자료 창을 닫은 뒤 지나가도록 잠시 미룸
        var dir = Math.random() < 0.5 ? 1 : -1;
        truck = { dir: dir, x: dir > 0 ? -truckImg.w - 4 : VW + 4, puff: 0 };
        truckTimer = rand(GIM.truckEvery[0], GIM.truckEvery[1]);
        sfx('truck');
      }
    } else {
      truck.x += truck.dir * 150 * dt;
      truck.puff += dt;
      if (truck.puff > 0.06) {
        truck.puff = 0;
        var rear = truck.dir > 0 ? truck.x + 2 : truck.x + truckImg.w - 2;
        dust.push({ x: rear, y: VH - 3 + rand(-1, 1), life: 0, vx: -truck.dir * rand(8, 20) });
      }
      if (truck.x > VW + 8 || truck.x < -truckImg.w - 8) truck = null;
    }
    dust.forEach(function (p) { p.life += dt; p.x += p.vx * dt; p.y -= dt * 6; });
    dust = dust.filter(function (p) { return p.life < 0.9; });
  }
  function drawTruck() {
    dust.forEach(function (p) {
      ctx.fillStyle = 'rgba(205,175,130,' + Math.max(0, 0.6 - p.life * 0.65).toFixed(2) + ')';
      var sz = 2 + Math.floor(p.life * 3);
      ctx.fillRect(Math.round(p.x - cam.x), Math.round(p.y - cam.y), sz, sz);
    });
    if (!truck) return;
    var bob = Math.floor(t * 9) % 2;                 // 덜컹덜컹
    var x = Math.round(truck.x - cam.x), y = VH - truckImg.h - cam.y + bob;
    ctx.fillStyle = 'rgba(30,20,10,0.25)'; ctx.fillRect(x + 1, VH - 2 - cam.y, truckImg.w - 2, 2);
    ctx.drawImage(truck.dir > 0 ? truckImg.right : truckImg.left, x, y);
  }

  // --- 물고기 ---
  var fish = null, fishTimer = rand(1.5, 3), rings = [], drops = [];
  function splash(x, y) {
    rings.push({ x: x, y: y, life: 0 });
    for (var i = 0; i < 4; i++) drops.push({ x: x, y: y, vx: rand(-14, 14), vy: rand(-34, -20), life: 0 });
  }
  function updateFish(dt) {
    var w = scene.water;
    if (!w) return;
    if (!fish) {
      fishTimer -= dt;
      if (fishTimer <= 0) {
        fishTimer = rand(GIM.fishEvery[0], GIM.fishEvery[1]);
        var a = Math.random() * Math.PI * 2, k = Math.sqrt(Math.random()) * 0.55, dir = Math.random() < 0.5 ? 1 : -1;
        var x0 = w.cx + Math.cos(a) * w.rx * k - dir * 5, y0 = w.cy + Math.sin(a) * w.ry * k;
        fish = { x0: x0, y0: y0, dir: dir, p: 0, color: Math.random() < 0.6 ? '#f08a3a' : '#d8e2e8' };

    if (game.count >= GOAL) {
      setPhase('carry');
      setTimeout(function () { sfx('chime'); pop('5개 모았다! 바구니로 →', player.x, player.y - heroH() - 4); }, 250);
    } else renderGame();
    return true;
  }
  function deliver() {
    if (game.phase !== 'carry') {
      pop(game.phase === 'done' ? '바구니가 가득 찼어요' : '감 ' + GOAL + '개를 모아 오세요', basketObj.x + 8, basketObj.y - 2);
      return;
    }
    basketObj.img = basketFull;
    game.cleared = true;
    setPhase('done');
    sfx('chime');
    celebrate('수확 완료!');
  }
  function updateGame(dt) {
    shakeTrees.forEach(function (tr) {
      if (tr.cool > 0) tr.cool -= dt;
      if (tr.obj && tr.obj.shake > 0) tr.obj.shake = Math.max(0, tr.obj.shake - dt);
    });
  }
  gameEl.addEventListener('click', function (e) {
    var b = e.target.closest('[data-game]');
    if (!b) return;
    if (b.getAttribute('data-game') === 'again') startGame();
    else { fruits = fruits.filter(function (f) { return !f.slow; }); setPhase('idle'); sfx('close'); }
    stage.focus({ preventScroll: true });
  });

  /* =========================================================
     업데이트 · 렌더
     ========================================================= */
  function update(dt) {
    t += dt;
    if (msgTimer > 0) { msgTimer -= dt; if (msgTimer <= 0) ui.msg.hidden = true; }
    if (trans) {
      trans.t += dt;
      if (trans.t >= 0.42) {
        if (trans.phase === 'close') { trans.next(); trans.phase = 'open'; trans.t = 0; }
        else { trans = null; stage.classList.remove('is-transitioning'); }
      }
    }
    var vx = 0, vy = 0;
    if (!paused && !trans) {
      vx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
      vy = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
      if (vx || vy) { path = null; onArrive = null; }
      else if (path && path.length) {
        var tg = path[0], dx = tg.x - player.x, dy = tg.y - player.y, dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 1.5) {
          path.shift();
          if (!path.length) { path = null; if (onArrive) { var f = onArrive; onArrive = null; f(); } }
        } else { vx = dx / dist; vy = dy / dist; }
      }
    }
    player.moving = !!(vx || vy);
    if (player.moving) {
      var SPEED = speed();
      var len = Math.sqrt(vx * vx + vy * vy), sp = SPEED * dt / len, ox = player.x, oy = player.y;
      var nx = player.x + vx * sp, ny = player.y + vy * sp;
      if (!blocked(scene, nx, player.y)) player.x = nx;
      if (!blocked(scene, player.x, ny)) player.y = ny;
      if (path && dt > 0) {
        stuck = Math.abs(player.x - ox) + Math.abs(player.y - oy) < SPEED * dt * 0.3 ? stuck + dt : 0;
        if (stuck > 0.2) {
          stuck = 0;
          path = ++replans <= 2 && goal ? findPath(scene, player.x, player.y, goal.x, goal.y) : null;
          if (!path) onArrive = null;
        }
      }
      player.dir = Math.abs(vx) > Math.abs(vy) ? (vx < 0 ? 'left' : 'right') : (vy < 0 ? 'up' : 'down');
      player.anim += dt * 7;
      stepTimer += dt;
      if (stepTimer > 0.27) { stepTimer = 0; sfx('step'); }
    } else { player.anim = 0; stepTimer = 0.2; }

    cam.x = Math.max(0, Math.min(scene.w - VW, Math.round(player.x - VW / 2)));
    cam.y = Math.max(0, Math.min(scene.h - VH, Math.round(player.y - VH / 2 - 12)));
    var prevNear = near;
    near = findNear();
    if (near && near !== prevNear && !trans) sfx('pop');
    updateFx(dt);
    updateGimmicks(dt);
    updateAnimals(dt);
    updateClock(dt);
  }

  function render() {
    ctx.drawImage(scene.base, -cam.x, -cam.y);
    drawFx();
    var farmGim = gimOn && scene.id === 'farm';
    if (farmGim) drawFish();
    var list = scene.objects.slice();
    list.push({ hero: true, sortY: player.y });
    if (scene.id === 'farm') fruits.forEach(function (f) { list.push({ fruit: f, sortY: f.ground + 0.5 }); });
    if (scene.id === 'farm') animalObjects(list);
    list.sort(function (a, b) { return a.sortY - b.sortY; });
    list.forEach(function (o) {
      if (o.fruit) {
        drawFruit(o.fruit);
      } else if (o.hero) {
        var frame = player.moving ? 1 + (Math.floor(player.anim) % 2) : 0;
        var bob = player.moving && frame === 1 ? -1 : 0;
        var hs = scene.small ? heroSmall : heroBig;
        ctx.fillStyle = 'rgba(40,25,10,0.25)';
        ctx.fillRect(Math.round(player.x - 5 - cam.x), Math.round(player.y - 1 - cam.y), 10, 2);
        ctx.drawImage(hs[player.dir][frame], Math.round(player.x - 8 - cam.x), Math.round(player.y - (heroH() - 1) - cam.y + bob));
      } else if (o.x - cam.x < VW && o.x + o.img.width - cam.x > 0 && o.y - cam.y < VH && o.y + o.img.height - cam.y > 0) {
        var sx = o.shake ? Math.round(Math.sin(t * 46) * o.shake * 3) : 0;      // 흔들리는 감나무
        ctx.drawImage(o.img, Math.round(o.x - cam.x) + sx, Math.round(o.y - cam.y));
      }
    });
    if (scene.id === 'farm') drawFeathers();
    if (farmGim) drawTruck();
    drawLeaves();
    if (path && path.length) {
      var end = path[path.length - 1], blink = Math.floor(t * 4) % 2 ? '#fff6df' : '#ffc777';
      PX.rect(ctx, end.x - cam.x - 3, end.y - cam.y - 1, 7, 1, blink);
      PX.rect(ctx, end.x - cam.x, end.y - cam.y - 4, 1, 7, blink);
    }
    if (trans) {
      var p = Math.min(1, trans.t / 0.42), rad = trans.phase === 'close' ? 260 * (1 - p) : 260 * p;
      ctx.fillStyle = '#120c08';
      ctx.beginPath(); ctx.rect(0, 0, VW, VH);
      ctx.arc(player.x - cam.x, player.y - heroH() / 2 - cam.y, Math.max(0, rad), 0, Math.PI * 2, true);
      ctx.fill('evenodd');
    }
  }

  /* =========================================================
     입력
     ========================================================= */
  var KEYMAP = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right', ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down' };

  function trapFocus(e, box) {
    var f = box.querySelectorAll('button, [href], [tabindex]:not([tabindex="-1"])');
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }

  // 자료 창 · 메뉴는 화면 전체 위에 뜨므로 문서 전체에서 키를 받음
  document.addEventListener('keydown', function (e) {
    if (currentDoc) {
      if (e.key === 'Escape') { e.preventDefault(); closeDoc(); }
      else if (e.key === 'Tab') trapFocus(e, ui.win);
    } else if (!ui.menu.hidden) {
      if (e.key === 'Escape') { e.preventDefault(); closeMenu(); }
      else if (e.key === 'Tab') trapFocus(e, ui.menu);
    }
  });
  // 게임 조작: 농장 화면에 포커스가 있거나, 포커스가 어디에도 없을 때(body) 받음
  function gameHasKeys(e) {
    return started && !currentDoc && ui.menu.hidden && stage.offsetParent !== null &&
      (e.target === stage || e.target === document.body);
  }
  document.addEventListener('keydown', function (e) {
    if (!gameHasKeys(e)) return;
    var k = KEYMAP[e.key];
    if (k && !e.ctrlKey && !e.metaKey && !e.altKey) { keys[k] = true; e.preventDefault(); return; }
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      if (catchAt(player.x, player.y - 6, 30)) return;
      if (near && !trans) act(near);
    }
  });
  document.addEventListener('keyup', function (e) { var k = KEYMAP[e.key]; if (k) delete keys[k]; });
  window.addEventListener('blur', function () { keys = {}; });

  canvas.addEventListener('click', function (e) {
    stage.focus({ preventScroll: true });
    if (paused || trans) return;
    var rect = canvas.getBoundingClientRect();
    var wx = (e.clientX - rect.left) / rect.width * VW + cam.x, wy = (e.clientY - rect.top) / rect.height * VH + cam.y;
    if (catchAt(wx, wy, 9)) return;
    var hit = null;
    scene.places.forEach(function (p) { var h = p.hit; if (wx >= h[0] && wx <= h[0] + h[2] && wy >= h[1] && wy <= h[1] + h[3]) hit = p; });
    if (hit) walkTo(hit.sx, hit.sy, function () { act(hit); });
    else walkTo(wx, wy);
  });

  ui.prompt.addEventListener('click', function () { if (near) act(near); });
  ui.msg.addEventListener('click', function () { ui.msg.hidden = true; });
  ui.winClose.addEventListener('click', function () { closeDoc(); });
  ui.winTabs.addEventListener('click', function (e) { var b = e.target.closest('[data-doc]'); if (b) openDoc(b.getAttribute('data-doc')); });
  ui.win.addEventListener('click', function (e) { if (e.target === ui.win) closeDoc(); });          // 바깥 클릭 → 닫기
  ui.menu.addEventListener('click', function (e) { if (e.target === ui.menu) closeMenu(); });
  ui.menuBtn.addEventListener('click', function () { if (ui.menu.hidden) openMenu(); else closeMenu(); });
  ui.menuList.addEventListener('click', function (e) { var b = e.target.closest('[data-doc]'); if (b) openDoc(b.getAttribute('data-doc'), ui.menuBtn); });

  /* =========================================================
     공개 API
     ========================================================= */
  buildWindowTabs();
  buildLabels();
  renderClock();
  ui.place.textContent = scene.hud;

  global.V1Farm = {
    start: function () {
      if (started) return;
      started = true;
      PX.loop(function (dt) { update(dt); render(); updateOverlay(); });
    },
    focus: function () { stage.focus({ preventScroll: true }); },
    openDoc: function (id) { openDoc(id); },
    closeDoc: function () { closeDoc(true); },
    get currentDoc() { return currentDoc; },
    on: function (name, fn) { handlers[name] = fn; },
    say: say,
    // 테스트용
    _debug: { player: player, walkTo: walkTo, get scene() { return scene.id; }, get near() { return near && near.id; },
      get fruits() { return fruits.map(function (f) { return [Math.round(f.x), Math.round(f.y)]; }); },
      get count() { return game.count; }, get phase() { return game.phase; } }
  };
})(window);

</script>
  <script>
/* js/v1-app.js */
/* =========================================================
   v1 화면 연결 — 인트로 ↔ 농장, URL 해시(#team 등), 인트로 기억
   ========================================================= */
(function () {
  'use strict';

  var KEY = 'farmcare_v1_intro_seen';
  var farmEl = document.getElementById('sv');
  var docIds = FarmDocs.list.map(function (d) { return d.id; });

  function seen() { try { return localStorage.getItem(KEY) === '1'; } catch (e) { return false; } }
  function markSeen() { try { localStorage.setItem(KEY, '1'); } catch (e) { /* 저장 실패해도 동작 */ } }
  function hashDoc() { var h = decodeURIComponent(location.hash.slice(1)); return docIds.indexOf(h) >= 0 ? h : null; }

  function showFarm(opts) {
    markSeen();
    document.body.setAttribute('data-view', 'farm');
    farmEl.hidden = false;
    BGM.play('farm');
    V1Farm.start();
    if (!opts || !opts.noFocus) V1Farm.focus();
  }

  function playIntro() {
    if (!V1Intro.story) { showFarm(); return; }
    V1Farm.closeDoc();
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
    document.body.setAttribute('data-view', 'intro');
    farmEl.hidden = true;
    BGM.play('intro');
    V1Intro.start(function () { showFarm(); });
  }

  // 자료 창이 열리고 닫힐 때 주소에 반영 (#premortem 처럼 공유 가능)
  V1Farm.on('onDoc', function (id) {
    var url = location.pathname + location.search + (id ? '#' + id : '');
    if (location.href.slice(-url.length) !== url) history.replaceState(null, '', url);
  });

  window.addEventListener('hashchange', function () {
    var id = hashDoc();
    if (id) { if (farmEl.hidden) { V1Intro.skip(); showFarm({ noFocus: true }); } V1Farm.openDoc(id); }
    else if (V1Farm.currentDoc) V1Farm.closeDoc();
  });

  document.getElementById('sv-replay').addEventListener('click', playIntro);
  SFX.bindButton(document.getElementById('intro-sound'));
  SFX.bindButton(document.getElementById('sv-sound'));
  BGM.bindButton(document.getElementById('intro-music'));
  BGM.bindButton(document.getElementById('sv-music'));
  Array.prototype.forEach.call(document.querySelectorAll('[data-quick]'), function (b) {
    b.addEventListener('click', function () { V1Farm.openDoc(b.getAttribute('data-quick')); });
  });

  V1Intro.load().catch(function () { return null; }).then(function () {
    var id = hashDoc();
    if (id) { showFarm({ noFocus: true }); V1Farm.openDoc(id); }
    else if (seen() || !V1Intro.story) showFarm();
    else playIntro();
  });
})();

</script>
